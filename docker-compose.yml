# Produccion: docker compose -f docker-compose.yml up -d --build
# Desarrollo: docker compose up --build (agrega docker-compose.override.yml)
# Las credenciales salen de .env (copiar .env.example).

x-base-datos: &base-datos
  # Sin esto los contenedores usan UTC y desde las 18:00 fechan todo con el dia siguiente.
  TZ: America/Guatemala
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: ${DB_USER:?Defina DB_USER en .env}
  DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}

services:

  mysql:
    image: mysql:8.0
    container_name: asilo-mysql
    restart: unless-stopped
    environment:
      TZ: America/Guatemala
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - red-asilo

  ms-costos:
    build: ./ms-costos
    container_name: asilo-ms-costos
    restart: unless-stopped
    environment:
      <<: *base-datos
      DB_NAME: db_costos
      API_KEY_SERVICIOS: ${API_KEY_SERVICIOS:?Defina API_KEY_SERVICIOS en .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - red-asilo

  ms-notificaciones:
    build: ./ms-notificaciones
    container_name: asilo-ms-notificaciones
    restart: unless-stopped
    environment:
      <<: *base-datos
      DB_NAME: db_notificaciones
      API_KEY_SERVICIOS: ${API_KEY_SERVICIOS}
      # Si se dejan vacias, los correos se registran en modo SIMULADA.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-asilo.cabezadealgodon@ejemplo.com}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - red-asilo

  app-base:
    build: ./app-base
    container_name: asilo-app-base
    restart: unless-stopped
    environment:
      <<: *base-datos
      DB_NAME: db_asilo
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY en .env}
      API_KEY_SERVICIOS: ${API_KEY_SERVICIOS}
      CLAVE_INICIAL_ADMIN: ${CLAVE_INICIAL_ADMIN:-}
      CLAVE_INICIAL_USUARIOS: ${CLAVE_INICIAL_USUARIOS:-}
      # true solo cuando el sistema este detras de HTTPS (cookie Secure + HSTS).
      HTTPS: ${HTTPS:-false}
      URL_MS_COSTOS: http://ms-costos:8001
      URL_MS_NOTIFICACIONES: http://ms-notificaciones:8002
    ports:
      - "${PUERTO_APP:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      ms-costos:
        condition: service_started
      ms-notificaciones:
        condition: service_started
    networks:
      - red-asilo

volumes:
  datos_mysql:

networks:
  red-asilo:
    driver: bridge
